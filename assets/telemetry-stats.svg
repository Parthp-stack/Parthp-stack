<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230">
  <defs>
    <linearGradient id="teleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#050e24"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b5"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a86b"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>

    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#b388ff"/>
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseBorder {
        0%, 100% { stroke: #00e5ff; }
        50% { stroke: #00ffa3; }
      }
      @keyframes barLoad {
        0% { width: 0; }
        100% { width: var(--target-width); }
      }
      @keyframes radarBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      .mono-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
      .frame-stroke {
        animation: pulseBorder 4s infinite alternate;
      }
      .radar-dot {
        animation: radarBlink 2s infinite ease-in-out;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="876" height="226" rx="14" fill="url(#teleBg)" stroke="#00e5ff" stroke-width="1.8" class="frame-stroke"/>

  <!-- Corner Brackets -->
  <path d="M 12 32 L 12 12 L 32 12" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#laserGlow)"/>
  <path d="M 868 32 L 868 12 L 848 12" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#laserGlow)"/>
  <path d="M 12 198 L 12 218 L 32 218" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#laserGlow)"/>
  <path d="M 868 198 L 868 218 L 848 218" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#laserGlow)"/>

  <!-- Top Title Banner -->
  <rect x="25" y="14" width="830" height="30" rx="6" fill="#091328" stroke="#00e5ff" stroke-width="0.8"/>
  <circle cx="45" cy="29" r="4.5" fill="#00ffa3" class="radar-dot" filter="url(#laserGlow)"/>
  <text x="58" y="33" class="mono-text" font-size="11.5" font-weight="700" fill="#00ffa3">LIVE TELEMETRY :: ACTIVE</text>
  <text x="440" y="33" text-anchor="middle" class="mono-text" font-size="12" font-weight="800" fill="#00e5ff" letter-spacing="2">PARTHP-STACK // SYSTEM_CAPACITY_MATRIX</text>
  <text x="835" y="33" text-anchor="end" class="mono-text" font-size="11" font-weight="600" fill="#8b949e">RATE_LIMIT_IMMUNE</text>

  <!-- LEFT PANEL: Core Engines Allocation -->
  <g transform="translate(35, 65)">
    <!-- Skill 1 -->
    <text x="0" y="14" class="mono-text" font-size="12" font-weight="700" fill="#00e5ff">FULL STACK ARCHITECTURE</text>
    <text x="340" y="14" text-anchor="end" class="mono-text" font-size="11" font-weight="800" fill="#00e5ff">95%</text>
    <rect x="0" y="22" width="340" height="8" rx="4" fill="#0d172e"/>
    <rect x="0" y="22" width="323" height="8" rx="4" fill="url(#cyanBar)" filter="url(#laserGlow)"/>

    <!-- Skill 2 -->
    <text x="0" y="52" class="mono-text" font-size="12" font-weight="700" fill="#00ffa3">AI &amp; DATA SCIENCE ENGINES</text>
    <text x="340" y="52" text-anchor="end" class="mono-text" font-size="11" font-weight="800" fill="#00ffa3">92%</text>
    <rect x="0" y="60" width="340" height="8" rx="4" fill="#0d172e"/>
    <rect x="0" y="60" width="312" height="8" rx="4" fill="url(#greenBar)" filter="url(#laserGlow)"/>

    <!-- Skill 3 -->
    <text x="0" y="90" class="mono-text" font-size="12" font-weight="700" fill="#b388ff">DSA &amp; ALGORITHMIC OPTIMIZATION</text>
    <text x="340" y="90" text-anchor="end" class="mono-text" font-size="11" font-weight="800" fill="#b388ff">96%</text>
    <rect x="0" y="98" width="340" height="8" rx="4" fill="#0d172e"/>
    <rect x="0" y="98" width="326" height="8" rx="4" fill="url(#purpleBar)" filter="url(#laserGlow)"/>

    <!-- Skill 4 -->
    <text x="0" y="128" class="mono-text" font-size="12" font-weight="700" fill="#ffd166">DEV TOOLS, DOCKER &amp; LINUX</text>
    <text x="340" y="128" text-anchor="end" class="mono-text" font-size="11" font-weight="800" fill="#ffd166">90%</text>
    <rect x="0" y="136" width="340" height="8" rx="4" fill="#0d172e"/>
    <rect x="0" y="136" width="306" height="8" rx="4" fill="#ffd166" opacity="0.9"/>
  </g>

  <!-- CENTER DIVIDER -->
  <line x1="420" y1="65" x2="420" y2="210" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <!-- RIGHT PANEL: Quantum Telemetry Cards -->
  <g transform="translate(450, 65)">
    <!-- Box 1 -->
    <rect x="0" y="5" width="185" height="64" rx="8" fill="#071226" stroke="#00e5ff" stroke-width="1.2"/>
    <text x="15" y="27" class="mono-text" font-size="10" font-weight="700" fill="#8b949e">CODE VELOCITY</text>
    <text x="15" y="53" class="mono-text" font-size="16" font-weight="800" fill="#00e5ff">MAXIMUM 🚀</text>

    <!-- Box 2 -->
    <rect x="205" y="5" width="185" height="64" rx="8" fill="#071226" stroke="#00ffa3" stroke-width="1.2"/>
    <text x="220" y="27" class="mono-text" font-size="10" font-weight="700" fill="#8b949e">SYSTEM STABILITY</text>
    <text x="220" y="53" class="mono-text" font-size="16" font-weight="800" fill="#00ffa3">99.98% ⚡</text>

    <!-- Box 3 -->
    <rect x="0" y="80" width="185" height="64" rx="8" fill="#071226" stroke="#b388ff" stroke-width="1.2"/>
    <text x="15" y="102" class="mono-text" font-size="10" font-weight="700" fill="#8b949e">PROBLEM SOLVING</text>
    <text x="15" y="128" class="mono-text" font-size="16" font-weight="800" fill="#b388ff">OPTIMIZED 🧠</text>

    <!-- Box 4 -->
    <rect x="205" y="80" width="185" height="64" rx="8" fill="#071226" stroke="#ffd166" stroke-width="1.2"/>
    <text x="220" y="102" class="mono-text" font-size="10" font-weight="700" fill="#8b949e">GIT SYNAPSE</text>
    <text x="220" y="128" class="mono-text" font-size="16" font-weight="800" fill="#ffd166">ONLINE 🛸</text>
  </g>

</svg>
