<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#050e24"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#0077b5"/>
      <stop offset="100%" stop-color="#00ffa3"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.7; }
        100% { transform: translateY(320px); opacity: 0.15; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
      @keyframes gridFade {
        0%, 100% { opacity: 0.08; }
        50% { opacity: 0.18; }
      }
      .mono-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      }
      .scanline {
        animation: scanBeam 4s ease-in-out infinite alternate;
      }
      .cursor {
        animation: blinkCursor 0.9s infinite;
      }
      .status-pulse {
        animation: pulseDot 1.8s infinite;
        transform-origin: center;
      }
      .cyber-grid {
        animation: gridFade 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Outer Background -->
  <rect x="2" y="2" width="876" height="336" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" filter="url(#subtleGlow)"/>

  <!-- Cybernetic Grid Pattern Overlay -->
  <g class="cyber-grid" stroke="#00e5ff" stroke-width="0.5">
    <line x1="2" y1="60" x2="878" y2="60"/>
    <line x1="2" y1="120" x2="878" y2="120"/>
    <line x1="2" y1="180" x2="878" y2="180"/>
    <line x1="2" y1="240" x2="878" y2="240"/>
    <line x1="2" y1="300" x2="878" y2="300"/>
    <line x1="150" y1="2" x2="150" y2="338"/>
    <line x1="300" y1="2" x2="300" y2="338"/>
    <line x1="450" y1="2" x2="450" y2="338"/>
    <line x1="600" y1="2" x2="600" y2="338"/>
    <line x1="750" y1="2" x2="750" y2="338"/>
  </g>

  <!-- Animated Laser Scanning Beam -->
  <g class="scanline">
    <line x1="8" y1="10" x2="872" y2="10" stroke="#00e5ff" stroke-width="2" filter="url(#neonGlow)"/>
    <rect x="8" y="6" width="864" height="8" fill="#00e5ff" opacity="0.06"/>
  </g>

  <!-- Futuristic Corner HUD Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#neonGlow)"/>
  <path d="M 868 36 L 868 12 L 844 12" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#neonGlow)"/>
  <path d="M 12 304 L 12 328 L 36 328" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#neonGlow)"/>
  <path d="M 868 304 L 868 328 L 844 328" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- HUD Header Bar -->
  <rect x="18" y="14" width="844" height="34" rx="6" fill="#091328" stroke="#00e5ff" stroke-width="0.8" opacity="0.85"/>
  
  <!-- Terminal Window Dots -->
  <circle cx="36" cy="31" r="5" fill="#ff5f56"/>
  <circle cx="52" cy="31" r="5" fill="#ffbd2e"/>
  <circle cx="68" cy="31" r="5" fill="#27c93f"/>

  <!-- Status Beacon -->
  <circle class="status-pulse" cx="95" cy="31" r="4" fill="#00ffa3" filter="url(#neonGlow)"/>
  <text x="108" y="35" class="mono-text" font-size="11" font-weight="700" fill="#00ffa3" letter-spacing="1">HUD :: ACTIVE</text>

  <!-- Title -->
  <text x="440" y="35" text-anchor="middle" class="mono-text" font-size="12" font-weight="800" fill="#00e5ff" letter-spacing="2">⚡ SYSTEM_SPECIFICATION // OPERATOR_DIAGNOSTICS ⚡</text>
  
  <text x="844" y="35" text-anchor="end" class="mono-text" font-size="11" font-weight="600" fill="#8b949e">BUILD_v3.0.4</text>

  <!-- Specification Lines -->
  <!-- Line 1: Operator -->
  <g transform="translate(35, 82)">
    <rect x="-10" y="-16" width="820" height="28" rx="4" fill="#00e5ff" opacity="0.04"/>
    <text x="0" y="4" class="mono-text" font-size="13" font-weight="800" fill="#00e5ff">❯ [ OPERATOR IDENTITY ]</text>
    <text x="215" y="4" class="mono-text" font-size="13" font-weight="700" fill="#0077b5">:</text>
    <text x="235" y="4" class="mono-text" font-size="14" font-weight="800" fill="#ffffff" filter="url(#subtleGlow)">PARTH PATIL</text>
    <rect x="360" y="-12" width="105" height="20" rx="10" fill="#00e5ff" opacity="0.15" stroke="#00e5ff" stroke-width="0.8"/>
    <text x="412" y="2" text-anchor="middle" class="mono-text" font-size="10" font-weight="700" fill="#00e5ff">LEVEL_ARCHITECT</text>
  </g>

  <!-- Line 2: Specialization -->
  <g transform="translate(35, 120)">
    <text x="0" y="4" class="mono-text" font-size="13" font-weight="800" fill="#00e5ff">❯ [ SPECIALIZATION ]</text>
    <text x="215" y="4" class="mono-text" font-size="13" font-weight="700" fill="#0077b5">:</text>
    <text x="235" y="4" class="mono-text" font-size="13.5" font-weight="600" fill="#e6edf3">Computer Science &amp; Engineering <tspan fill="#00ffa3" font-weight="700">(Data Science Specialization)</tspan></text>
  </g>

  <!-- Line 3: Directive -->
  <g transform="translate(35, 158)">
    <rect x="-10" y="-16" width="820" height="28" rx="4" fill="#00e5ff" opacity="0.04"/>
    <text x="0" y="4" class="mono-text" font-size="13" font-weight="800" fill="#00e5ff">❯ [ CORE DIRECTIVE ]</text>
    <text x="215" y="4" class="mono-text" font-size="13" font-weight="700" fill="#0077b5">:</text>
    <text x="235" y="4" class="mono-text" font-size="13.5" font-weight="600" fill="#e6edf3">Engineer High-Performance Software, Data Engines &amp; Neural Models</text>
  </g>

  <!-- Line 4: Active Pipeline -->
  <g transform="translate(35, 196)">
    <text x="0" y="4" class="mono-text" font-size="13" font-weight="800" fill="#00e5ff">❯ [ ACTIVE PIPELINE ]</text>
    <text x="215" y="4" class="mono-text" font-size="13" font-weight="700" fill="#0077b5">:</text>
    <text x="235" y="4" class="mono-text" font-size="13" font-weight="700" fill="#00e5ff">Full Stack Ecosystems</text>
    <text x="420" y="4" class="mono-text" font-size="13" font-weight="700" fill="#8b949e">➔</text>
    <text x="445" y="4" class="mono-text" font-size="13" font-weight="700" fill="#00ffa3">Machine Learning</text>
    <text x="595" y="4" class="mono-text" font-size="13" font-weight="700" fill="#8b949e">➔</text>
    <text x="620" y="4" class="mono-text" font-size="13" font-weight="700" fill="#b388ff">Production AI Systems</text>
  </g>

  <!-- Line 5: Operational Philosophy -->
  <g transform="translate(35, 234)">
    <rect x="-10" y="-16" width="820" height="28" rx="4" fill="#00e5ff" opacity="0.04"/>
    <text x="0" y="4" class="mono-text" font-size="13" font-weight="800" fill="#00e5ff">❯ [ CORE PHILOSOPHY ]</text>
    <text x="215" y="4" class="mono-text" font-size="13" font-weight="700" fill="#0077b5">:</text>
    <text x="235" y="4" class="mono-text" font-size="13.5" font-style="italic" font-weight="600" fill="#ffd166">"Don't just observe technology — build the code that creates the future."</text>
  </g>

  <!-- Line 6: Environment & Execution -->
  <g transform="translate(35, 272)">
    <text x="0" y="4" class="mono-text" font-size="13" font-weight="800" fill="#00e5ff">❯ [ WORK ENVIRONMENT ]</text>
    <text x="215" y="4" class="mono-text" font-size="13" font-weight="700" fill="#0077b5">:</text>
    <text x="235" y="4" class="mono-text" font-size="13" font-weight="600" fill="#e6edf3">Linux Kernel • Windows OS • Git Workflows • Cloud Clusters</text>
  </g>

  <!-- Line 7: Status & Terminal Cursor -->
  <g transform="translate(35, 308)">
    <rect x="-10" y="-16" width="820" height="26" rx="4" fill="#00ffa3" opacity="0.06"/>
    <text x="0" y="2" class="mono-text" font-size="13" font-weight="800" fill="#00ffa3">❯ [ QUANTUM STATUS ]</text>
    <text x="215" y="2" class="mono-text" font-size="13" font-weight="700" fill="#00ffa3">:</text>
    <text x="235" y="2" class="mono-text" font-size="13" font-weight="800" fill="#00ffa3" filter="url(#subtleGlow)">[ONLINE] READY TO BUILD &amp; COLLABORATE</text>
    <rect class="cursor" x="575" y="-11" width="10" height="16" fill="#00ffa3"/>
  </g>

</svg>
