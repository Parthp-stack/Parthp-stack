<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#050e24"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f3d"/>
      <stop offset="100%" stop-color="#060c1c"/>
    </linearGradient>

    <!-- Pulse Filter -->
    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { stroke: #00e5ff; filter: drop-shadow(0 0 4px #00e5ff); }
        50% { stroke: #00ffa3; filter: drop-shadow(0 0 9px #00ffa3); }
      }
      @keyframes laserParticle {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .laser-wire {
        stroke-dasharray: 8 6;
        animation: dashFlow 1.2s linear infinite;
      }
      .hud-node {
        animation: pulseNode 3s ease-in-out infinite;
        transition: all 0.3s ease;
      }
      .mono-text {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="876" height="246" rx="14" fill="url(#pipeBg)" stroke="#00e5ff" stroke-width="1.6" opacity="0.95"/>

  <!-- Corner Accents -->
  <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#neonPulse)"/>
  <path d="M 870 30 L 870 10 L 850 10" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#neonPulse)"/>
  <path d="M 10 220 L 10 240 L 30 240" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#neonPulse)"/>
  <path d="M 870 220 L 870 240 L 850 240" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#neonPulse)"/>

  <!-- Header -->
  <text x="440" y="32" text-anchor="middle" class="mono-text" font-size="12" font-weight="800" fill="#00e5ff" letter-spacing="2">⚡ CONTINUOUS_DEVELOPER_EXECUTION_FLOW // PIPELINE_MATRIX ⚡</text>

  <!-- Connecting Animated Laser Wires -->
  <!-- Wire 1 -> 2 -->
  <path d="M 185 85 L 245 85" fill="none" stroke="#00e5ff" stroke-width="2.5" class="laser-wire" filter="url(#neonPulse)"/>
  <!-- Wire 2 -> 3 -->
  <path d="M 395 85 L 455 85" fill="none" stroke="#00e5ff" stroke-width="2.5" class="laser-wire" filter="url(#neonPulse)"/>
  <!-- Wire 3 -> 4 -->
  <path d="M 605 85 L 665 85" fill="none" stroke="#00e5ff" stroke-width="2.5" class="laser-wire" filter="url(#neonPulse)"/>

  <!-- Return Flow Wires -->
  <!-- Wire 4 Down to Optimize -->
  <path d="M 740 120 L 740 180 L 595 180" fill="none" stroke="#00ffa3" stroke-width="2" class="laser-wire" filter="url(#neonPulse)"/>
  <!-- Wire Optimize to Evolve -->
  <path d="M 385 180 L 295 180" fill="none" stroke="#00ffa3" stroke-width="2" class="laser-wire" filter="url(#neonPulse)"/>
  <!-- Wire Evolve back up to Analyze -->
  <path d="M 125 155 L 125 120" fill="none" stroke="#00ffa3" stroke-width="2" class="laser-wire" filter="url(#neonPulse)"/>

  <!-- ================= TOP STAGE NODES ================= -->

  <!-- Node 1: ANALYZE -->
  <g transform="translate(35, 55)">
    <rect width="150" height="60" rx="8" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="1.8" class="hud-node"/>
    <text x="75" y="26" text-anchor="middle" class="mono-text" font-size="12" font-weight="800" fill="#00e5ff">01 // ANALYZE</text>
    <text x="75" y="44" text-anchor="middle" class="mono-text" font-size="9.5" font-weight="600" fill="#8b949e">Deconstruct Complexity</text>
  </g>

  <!-- Node 2: ARCHITECT -->
  <g transform="translate(245, 55)">
    <rect width="150" height="60" rx="8" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="1.8" class="hud-node"/>
    <text x="75" y="26" text-anchor="middle" class="mono-text" font-size="12" font-weight="800" fill="#00e5ff">02 // ARCHITECT</text>
    <text x="75" y="44" text-anchor="middle" class="mono-text" font-size="9.5" font-weight="600" fill="#8b949e">DSA • Clean Schemas</text>
  </g>

  <!-- Node 3: EXECUTE -->
  <g transform="translate(455, 55)">
    <rect width="150" height="60" rx="8" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="1.8" class="hud-node"/>
    <text x="75" y="26" text-anchor="middle" class="mono-text" font-size="12" font-weight="800" fill="#00ffa3">03 // EXECUTE</text>
    <text x="75" y="44" text-anchor="middle" class="mono-text" font-size="9.5" font-weight="600" fill="#8b949e">Clean Code • AI Models</text>
  </g>

  <!-- Node 4: DEPLOY -->
  <g transform="translate(665, 55)">
    <rect width="150" height="60" rx="8" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="1.8" class="hud-node"/>
    <text x="75" y="26" text-anchor="middle" class="mono-text" font-size="12" font-weight="800" fill="#00e5ff">04 // DEPLOY</text>
    <text x="75" y="44" text-anchor="middle" class="mono-text" font-size="9.5" font-weight="600" fill="#8b949e">Production Release</text>
  </g>

  <!-- ================= BOTTOM FEEDBACK LOOP NODES ================= -->

  <!-- Node 5: BENCHMARK & OPTIMIZE -->
  <g transform="translate(385, 150)">
    <rect width="210" height="58" rx="8" fill="url(#nodeGrad)" stroke="#00ffa3" stroke-width="1.8" class="hud-node"/>
    <text x="105" y="25" text-anchor="middle" class="mono-text" font-size="12" font-weight="800" fill="#00ffa3">05 // BENCHMARK &amp; OPTIMIZE</text>
    <text x="105" y="43" text-anchor="middle" class="mono-text" font-size="9.5" font-weight="600" fill="#8b949e">Refactoring • Speed • Scalability</text>
  </g>

  <!-- Node 6: CONTINUOUS EVOLUTION -->
  <g transform="translate(85, 150)">
    <rect width="210" height="58" rx="8" fill="url(#nodeGrad)" stroke="#00ffa3" stroke-width="1.8" class="hud-node"/>
    <text x="105" y="25" text-anchor="middle" class="mono-text" font-size="12" font-weight="800" fill="#00ffa3">06 // CONTINUOUS EVOLUTION</text>
    <text x="105" y="43" text-anchor="middle" class="mono-text" font-size="9.5" font-weight="600" fill="#8b949e">Compounding Knowledge &amp; Impact</text>
  </g>

  <!-- Live Pulse Beacon Center -->
  <circle cx="440" cy="228" r="4" fill="#00ffa3" filter="url(#neonPulse)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="452" y="232" class="mono-text" font-size="10.5" font-weight="700" fill="#8b949e">STATE: <tspan fill="#00ffa3">RECURSIVE EXCELLENCE LOOP ACTIVE</tspan></text>

</svg>
